<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaiL</title>
<link rel="icon" href="icon.png">
<style>
  :root { --bg:#fbfbfd; --text:#1d1d1f; --muted:#6e6e73; --link:#0066cc; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --text:#f5f5f7; --muted:#a1a1a6; --link:#2997ff; } }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:17px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
         min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:48px 16px; text-align:center; }
  img { width:128px; height:128px; margin-bottom:28px; }
  h1 { font:600 48px/1.08 -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; letter-spacing:-.003em; }
  p { color:var(--muted); font-size:21px; margin-top:12px; max-width:560px; }
  footer { margin-top:48px; font-size:14px; color:var(--muted); }
  a { color:var(--link); text-decoration:none; } a:hover { text-decoration:underline; }
</style>
</head>
<body>
  <img src="icon.png" alt="Icono de MaiL">
  <h1>MaiL</h1>
  <p>Una herramienta personal que permite a Pablo gestionar sus cuentas de correo con su asistente Claude, desde su propio ordenador.</p>
  <footer><a href="privacy.html">Política de privacidad</a></footer>
</body>
</html>
